[versions]
# Kotlin
kotlin = "2.3.10"

# Libraries
postgresql = "42.7.10"
kotliquery = "1.9.0"
testcontainers = "1.21.4"
junit-jupiter = "5.10.0"
kotlin-logging = "7.0.3"
kotlinx-serialization-json = "1.6.3"
slf4j-simple = "2.0.16"

# Plugins
changelog = "2.2.1"
intelliJPlatform = "2.13.1"
detekt = "1.23.8"
ktlint = "12.1.0"
ktlint-tool = "1.7.1"
serialization = "2.3.10"

[libraries]
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
kotliquery = { group = "com.github.seratch", name = "kotliquery", version.ref = "kotliquery" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j-simple" }

# JUnit
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-jupiter" }

# Testcontainers
testcontainers = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }

[bundles]
testcontainers = ["testcontainers", "testcontainers-postgresql", "testcontainers-junit-jupiter"]
testing = ["kotlin-test", "junit-jupiter-api", "junit-jupiter-engine"]

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "serialization"}
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }